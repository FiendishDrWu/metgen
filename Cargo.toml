[package]
name = "metgen"
version = "0.9.6"
edition = "2021"

[features]
# Default to smaller OpenGL backend.
default = ["glow_backend"]

# Choose one at build time (glow is default).
glow_backend = ["eframe/glow"]
wgpu_backend = ["eframe/wgpu"]

[dependencies]
# GUI (backend chosen via features above)
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui   = "0.29"

# Minimal windowing; platform backends toggled per-target below.
winit = { version = "0.30.12", default-features = false, features = ["rwh_05"] }

# HTTP + JSON (trimmed for size)
reqwest = { version = "0.12", default-features = false, features = ["blocking","json","rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde","clock"] }
urlencoding = "2"
base64 = "0.22"

# Concurrency
crossbeam-channel = "0.5"

[dev-dependencies]
pretty_assertions = "1"

# --- Linux: enable Wayland + X11 backends automatically ---
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_05","wayland","wayland-dlopen","x11"] }

# Optional: size-focused release profile
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"   # if supported; otherwise strip after build